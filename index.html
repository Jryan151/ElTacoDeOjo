<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Taco De Ojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen pb-20 flex flex-col justify-between">
    <div class="max-w-md mx-auto w-full flex-grow">
        <!-- Landing View -->
        <div id="landingView" class="p-6 flex flex-col items-center justify-center min-h-[90vh] text-center">
            <div class="w-24 h-24 rounded-full border-2 border-pink-500 p-1 mb-4 flex items-center justify-center shadow-lg shadow-pink-500/10">
                <span class="text-4xl">🌮</span>
            </div>
            <h1 class="text-3xl font-serif font-bold italic tracking-wide mb-1">El Taco De Ojo</h1>
            <p class="text-zinc-400 text-sm mb-3">Authentic Mexican Food</p>
            
            <div class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 mb-4 text-left shadow-md">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[11px] text-zinc-400 font-medium">📍 Active Truck Location (Click to Map):</label>
                </div>
                <div id="activeLocationDisplay" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-300 font-medium"></div>
            </div>

            <div id="storeStatusBadge" class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-emerald-400 flex items-center gap-2 w-full justify-center">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="storeStatusText">Open Now • Until 6:00 PM</span>
            </div>

            <div id="waitTimeWarningBanner" class="hidden w-full bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-6 text-xs text-amber-400 flex items-center gap-2 justify-center">
                <span>⚠️️</span> <span id="waitTimeWarningText">Kitchen is currently running a slightly higher wait time.</span>
            </div>

            <div class="w-full space-y-3">
                <button onclick="switchView('menu')" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-pink-600/25">Start Order</button>
                <button onclick="switchView('tracker')" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 font-medium py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm"><span>📍</span> Track Order Status</button>
            </div>

            <div class="mt-12 text-center">
                <a href="https://instagram.com/el_taco_de_ojo" target="_blank" class="text-xs text-pink-500 hover:text-pink-400 tracking-wider font-medium flex items-center justify-center gap-1.5"><span>📷</span> @el_taco_de_ojo</a>
            </div>
        </div>

        <!-- Menu View -->
        <div id="menuView" class="p-4 hidden">
            <div class="flex items-center justify-between mb-4 sticky top-0 bg-zinc-950/90 backdrop-blur py-2 z-10 border-b border-zinc-900">
                <button onclick="switchView('landing')" class="text-zinc-400 text-sm hover:text-white">← Back</button>
                <h2 class="font-bold text-lg">Order Menu</h2>
                <div class="w-10"></div>
            </div>
            
            <div class="bg-gradient-to-r from-pink-950/40 to-amber-950/40 border border-pink-500/30 rounded-xl p-3 mb-5 text-xs">
                <div class="font-bold text-pink-400 mb-1 flex items-center gap-1"><span>🔥</span> Popular Item Highlights</div>
                <div id="popularHighlightsContainer" class="grid grid-cols-3 gap-2 text-center mt-2"></div>
            </div>

            <div id="menuContainer" class="space-y-6"></div>
            
            <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto">
                <button onclick="openCartModal()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl shadow-xl flex justify-between px-5 items-center">
                    <span id="cartCountBadge" class="bg-pink-700 px-2 py-0.5 rounded-md text-xs font-bold">0 items</span>
                    <span>View Cart</span>
                    <span id="cartTotalBadge">$0.00</span>
                </button>
            </div>
        </div>

        <!-- Tracker View -->
        <div id="trackerView" class="p-4 hidden">
            <div class="flex items-center justify-between mb-4 border-b border-zinc-900 pb-2">
                <button onclick="switchView('landing')" class="text-zinc-400 text-sm hover:text-white">← Back</button>
                <h2 class="font-bold text-lg">Order Tracker</h2>
                <div class="w-10"></div>
            </div>
            <div class="space-y-3" id="activeOrdersList"></div>
        </div>
    </div>

    <!-- Item Customization & Quantity Modal -->
    <div id="itemModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center"><h3 id="itemModalTitle" class="font-bold text-lg text-pink-400">Add to Order</h3><button onclick="closeItemModal()" class="text-zinc-400 hover:text-white text-sm">✕</button></div>
            <div id="itemModalMeatSection" class="hidden">
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Select Meat Type</label>
                <select id="itemMeatSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200">
                    <option value="Asada">Asada</option>
                    <option value="Pastor">Pastor</option>
                    <option value="Cabeza">Cabeza</option>
                    <option value="Birria">Birria</option>
                    <option value="Pollo">Pollo</option>
                </select>
            </div>
            <div id="itemModalDrinkSection" class="hidden">
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Select Flavor Option</label>
                <select id="itemDrinkSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200"></select>
            </div>
            <div>
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Quantity</label>
                <div class="flex items-center gap-3">
                    <button onclick="adjustModalQty(-1)" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-base font-bold flex items-center justify-center">-</button>
                    <span id="itemModalQty" class="text-lg font-mono font-bold flex-1 text-center">1</span>
                    <button onclick="adjustModalQty(1)" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-base font-bold flex items-center justify-center">+</button>
                </div>
            </div>
            <button onclick="confirmAddToCart()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-pink-600/20">Confirm & Add to Cart</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3"><h3 class="font-bold text-lg">Your Order Cart</h3><button onclick="closeCartModal()" class="text-zinc-400 hover:text-white text-sm">✕</button></div>
            <div id="cartItemsList" class="space-y-3"></div>
            <div class="space-y-3 pt-2 border-t border-zinc-800">
                <div><label class="block text-xs text-zinc-400 mb-1">Your Name (Optional)</label><input type="text" id="customerName" placeholder="Enter name or leave blank for Guest" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200"></div>
                <div><label class="block text-xs text-zinc-400 mb-1">Special Requests / Notes</label><textarea id="customerOrderNotes" placeholder="Notes..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200 h-20 resize-none"></textarea></div>
            </div>
            <button onclick="submitOrder()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl transition">Place Order</button>
        </div>
    </div>

    <!-- Success Checkout Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-6 text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">✓</div>
            <h3 class="font-bold text-lg text-zinc-100">Order Placed Successfully!</h3>
            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-1">
                <div class="text-xs text-zinc-400">Assigned Ticket Number:</div>
                <div id="successTicketNum" class="text-2xl font-mono font-bold text-pink-500">#000</div>
                <div id="successCustomerName" class="text-xs text-zinc-300 font-medium pt-1"></div>
            </div>
            <button onclick="closeSuccessModal()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2.5 rounded-xl text-xs transition">View in Tracker</button>
        </div>
    </div>

    <script>
        const app = {
            get cart() { return JSON.parse(localStorage.getItem('foodtruck_cart')) || []; },
            set cart(val) { localStorage.setItem('foodtruck_cart', JSON.stringify(val)); },
            get locations() { return JSON.parse(localStorage.getItem('foodtruck_locations')) || [
                { id: 1, name: "Downtown Lot", address: "742 S 7th St, Phoenix, AZ 85004" }
            ]; },
            get activeLocationId() { return parseInt(localStorage.getItem('foodtruck_active_loc')) || 1; },
            get isOpen() { return JSON.parse(localStorage.getItem('foodtruck_isopen')) ?? true; },
            get closingTime() { return localStorage.getItem('foodtruck_closingtime') || "6:00 PM"; },
            get orders() { return JSON.parse(localStorage.getItem('foodtruck_orders')) || []; },
            set orders(val) { localStorage.setItem('foodtruck_orders', JSON.stringify(val)); },
            get extraWait() { return localStorage.getItem('foodtruck_extrawait') || ''; },
            get menu() { return JSON.parse(localStorage.getItem('foodtruck_menu')) || [
                { id: 1, category: "Tacos & Specialties", name: "Taco", price: 3.50, markdownPrice: null, desc: "Meat, cilantro, onion (Asada, Pastor, Cabeza, Birria, Pollo).", prep: "2 mins", soldOut: false, hasMeat: true },
                { id: 2, category: "Tacos & Specialties", name: "Vampiro", price: 4.50, markdownPrice: null, desc: "Meat, cheese, cilantro and onion on crispy tortilla.", prep: "3 mins", soldOut: false, hasMeat: true },
                { id: 3, category: "Tacos & Specialties", name: "Quesabirria w/ Consomé", price: 5.50, markdownPrice: null, desc: "Meat, cheese, cilantro, onion and rich beef broth consomé.", prep: "4 mins", soldOut: false, hasMeat: true },
                { id: 4, category: "Tacos & Specialties", name: "Quesacamaron w/ Broth", price: 6.00, markdownPrice: null, desc: "Shrimp, cheese, pico de gallo and its broth.", prep: "4 mins", soldOut: false, hasMeat: false },
                { id: 5, category: "Main Entrées & Plates", name: "Burrito", price: 12.00, markdownPrice: null, desc: "Meat, rice, beans, cabbage, cilantro, onion, guacamole.", prep: "5 mins", soldOut: false, hasMeat: true },
                { id: 6, category: "Main Entrées & Plates", name: "Torta w/ Fries", price: 15.50, markdownPrice: null, desc: "Meat, mayo, beans, chipotle sauce, cabbage, cilantro, onion, tomato, avocado, queso fresco, jalapeños w/ fries.", prep: "6 mins", soldOut: false, hasMeat: true },
                { id: 7, category: "Main Entrées & Plates", name: "Carne Asada Fries", price: 15.00, markdownPrice: null, desc: "Fries, meat, cheese, chipotle sauce, sour cream, avocado sauce, topped with guacamole.", prep: "5 mins", soldOut: false, hasMeat: true },
                { id: 8, category: "Main Entrées & Plates", name: "Birria Nachos", price: 14.00, markdownPrice: null, desc: "Meat, tortilla chips, nacho cheese, pico, jalapeños.", prep: "5 mins", soldOut: false, hasMeat: true },
                { id: 9, category: "Main Entrées & Plates", name: "1/2 & 1/2", price: 17.00, markdownPrice: null, desc: "Half Carne Asada Fries & half Birria Nachos.", prep: "6 mins", soldOut: false, hasMeat: false },
                { id: 10, category: "Refreshing Drinks", name: "Agua Fresca", price: 4.00, markdownPrice: null, desc: "Limonada de Pepino, Jamaica, Horchata.", isDrink: true, options: ["Limonada de Pepino", "Jamaica", "Horchata"], prep: "1 min", soldOut: false },
                { id: 11, category: "Refreshing Drinks", name: "Mexican Coke / Jarritos", price: 3.50, markdownPrice: null, desc: "Authentic bottled cane sugar beverages.", prep: "1 min", soldOut: false }
            ]; }
        };

        function initApp() { 
            updateLandingUI();
            updateCartBadges();
            renderPopularHighlights();
        }

        function updateLandingUI() {
            const loc = app.locations.find(l => l.id === app.activeLocationId) || app.locations[0];
            const locDisplay = document.getElementById('activeLocationDisplay');
            if (locDisplay && loc) {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.name + ' ' + loc.address)}`;
                locDisplay.innerHTML = `<a href="${mapsUrl}" target="_blank" class="text-pink-400 hover:underline flex flex-col gap-0.5"><strong>${loc.name}</strong><span class="text-zinc-400 text-[11px]">${loc.address} ↗</span></a>`;
            }

            const statusBadge = document.getElementById('storeStatusBadge');
            const statusText = document.getElementById('storeStatusText');
            const closing = app.closingTime;
            if (statusBadge && statusText) {
                if (app.isOpen) {
                    statusBadge.className = "bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-emerald-400 flex items-center gap-2 w-full justify-center";
                    statusText.innerText = `Open Now • Until ${closing}`;
                } else {
                    statusBadge.className = "bg-rose-500/10 border border-rose-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-rose-400 flex items-center gap-2 w-full justify-center";
                    statusText.innerText = "Closed Right Now";
                }
            }

            const waitBanner = document.getElementById('waitTimeWarningBanner');
            const waitText = document.getElementById('waitTimeWarningText');
            const extra = app.extraWait;
            if (waitBanner && waitText) {
                if (extra) {
                    waitBanner.classList.remove('hidden');
                    waitText.innerText = extra === '15' ? "Kitchen is slightly busy (+15m wait time)." : "Kitchen is very busy (+30m wait time).";
                } else {
                    waitBanner.classList.add('hidden');
                }
            }
        }

        function switchView(view) {
            ['landingView', 'menuView', 'trackerView'].forEach(v => {
                const el = document.getElementById(v);
                if (el) el.style.display = 'none';
            });
            if (view === 'landing') document.getElementById('landingView').style.display = 'flex';
            if (view === 'menu') { document.getElementById('menuView').style.display = 'block'; renderMenu(); }
            if (view === 'tracker') { document.getElementById('trackerView').style.display = 'block'; renderTracker(); }
        }

        function renderPopularHighlights() {
            const container = document.getElementById('popularHighlightsContainer');
            if (!container) return;
            const defaults = ["Quesabirria w/ Consomé", "Carne Asada Fries", "Taco"];
            container.innerHTML = defaults.map((name, idx) => {
                const labels = ["TOP ITEM", "POPULAR", "FAVORITE"];
                const itemObj = app.menu.find(m => m.name.toLowerCase() === name.toLowerCase()) || app.menu[0];
                return `<div onclick="openItemModal(${itemObj.id})" class="bg-zinc-950/60 p-2 rounded-lg border border-zinc-800 cursor-pointer hover:border-pink-500 transition"><span class="text-[9px] text-zinc-400 block font-semibold">${labels[idx]}</span><span class="font-bold text-zinc-200 text-[11px] truncate block">${itemObj.name}</span></div>`;
            }).join('');
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if (!container) return;
            const categories = [...new Set(app.menu.map(i => i.category))];
            container.innerHTML = categories.map(cat => `
                <div>
                    <h3 class="font-bold text-pink-500 mb-3 text-sm">🔥 ${cat}</h3>
                    <div class="space-y-3">
                        ${app.menu.filter(i => i.category === cat).map(item => {
                            const hasSale = item.markdownPrice !== null && item.markdownPrice !== undefined && item.markdownPrice < item.price;
                            const effectivePrice = hasSale ? item.markdownPrice : item.price;
                            return `
                                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center ${item.soldOut ? 'opacity-50' : ''}">
                                    <div>
                                        <h4 class="font-bold text-sm flex items-center gap-2">
                                            ${item.name}${item.soldOut ? '<span class="text-[10px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded font-mono">SOLD OUT</span>' : ''}
                                            ${hasSale ? '<span class="text-[10px] bg-pink-500/20 text-pink-400 px-1.5 py-0.5 rounded font-mono font-bold">SALE</span>' : ''}
                                        </h4>
                                        <p class="text-xs text-zinc-400 mt-0.5">${item.desc}</p>
                                        <div class="flex items-center gap-3 mt-2">
                                            ${hasSale ? `<span class="text-sm font-bold text-pink-400">$${effectivePrice.toFixed(2)}</span><span class="text-xs text-zinc-500 line-through">$${item.price.toFixed(2)}</span>` : `<span class="text-sm font-semibold text-pink-500">$${item.price.toFixed(2)}</span>`}
                                            <span class="text-[10px] text-zinc-500">(~${item.prep})</span>
                                        </div>
                                    </div>
                                    <button ${item.soldOut ? 'disabled' : ''} onclick="openItemModal(${item.id})" class="bg-pink-600 hover:bg-pink-500 disabled:bg-zinc-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold h-8 min-w-[55px] flex items-center justify-center shadow">Add +</button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
            updateCartBadges();
            renderPopularHighlights();
        }

        let currentModalItem = null;
        let currentModalQtyVal = 1;

        function openItemModal(id) {
            const item = app.menu.find(m => m.id === id);
            if (item.soldOut) return;
            currentModalItem = item;
            currentModalQtyVal = 1;
            document.getElementById('itemModalQty').innerText = currentModalQtyVal;
            document.getElementById('itemModalTitle').innerText = `Add ${item.name}`;

            const meatSec = document.getElementById('itemModalMeatSection');
            const drinkSec = document.getElementById('itemModalDrinkSection');

            if (item.hasMeat) {
                meatSec.classList.remove('hidden');
            } else {
                meatSec.classList.add('hidden');
            }

            if (item.isDrink) {
                drinkSec.classList.remove('hidden');
                document.getElementById('itemDrinkSelect').innerHTML = item.options.map(o => `<option value="${o}">${o}</option>`).join('');
            } else {
                drinkSec.classList.add('hidden');
            }

            document.getElementById('itemModal').style.display = 'flex';
        }

        function closeItemModal() {
            document.getElementById('itemModal').style.display = 'none';
            currentModalItem = null;
        }

        function adjustModalQty(delta) {
            currentModalQtyVal += delta;
            if (currentModalQtyVal < 1) currentModalQtyVal = 1;
            document.getElementById('itemModalQty').innerText = currentModalQtyVal;
        }

        function confirmAddToCart() {
            if (!currentModalItem) return;
            let itemName = currentModalItem.name;
            let extraDetails = [];

            if (currentModalItem.hasMeat) {
                const meat = document.getElementById('itemMeatSelect').value;
                extraDetails.push(meat);
            }
            if (currentModalItem.isDrink) {
                const flavor = document.getElementById('itemDrinkSelect').value;
                extraDetails.push(flavor);
            }

            if (extraDetails.length > 0) {
                itemName += ` (${extraDetails.join(', ')})`;
            }

            const effectivePrice = (currentModalItem.markdownPrice !== null && currentModalItem.markdownPrice !== undefined && currentModalItem.markdownPrice < currentModalItem.price) ? currentModalItem.markdownPrice : currentModalItem.price;

            let cart = app.cart;
            const existing = cart.find(c => c.name === itemName);
            if (existing) {
                existing.quantity += currentModalQtyVal;
            } else {
                cart.push({ id: currentModalItem.id, name: itemName, price: effectivePrice, quantity: currentModalQtyVal });
            }
            app.cart = cart;
            closeItemModal();
            updateCartBadges();
        }

        function updateCartBadges() {
            const cart = app.cart;
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const countBadge = document.getElementById('cartCountBadge');
            const totalBadge = document.getElementById('cartTotalBadge');
            if (countBadge) countBadge.innerText = `${count} items`;
            if (totalBadge) totalBadge.innerText = `$${total.toFixed(2)}`;
        }

        function openCartModal() {
            const cart = app.cart;
            if (cart.length === 0) { alert("Cart is empty!"); return; }
            renderCartItems();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function renderCartItems() {
            const cart = app.cart;
            document.getElementById('cartItemsList').innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-zinc-950 p-3 rounded-xl border border-zinc-800 text-sm">
                    <div>
                        <div class="font-bold">${item.name}</div>
                        <div class="text-xs text-pink-500 font-semibold">$${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="adjustCartQuantity(${idx}, -1)" class="w-6 h-6 bg-zinc-800 hover:bg-zinc-700 rounded text-xs font-bold flex items-center justify-center">-</button>
                        <span class="text-xs font-mono w-4 text-center">${item.quantity}</span>
                        <button onclick="adjustCartQuantity(${idx}, 1)" class="w-6 h-6 bg-zinc-800 hover:bg-zinc-700 rounded text-xs font-bold flex items-center justify-center">+</button>
                        <button onclick="removeFromCart(${idx})" class="ml-2 text-zinc-500 hover:text-rose-400 text-xs">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function adjustCartQuantity(index, delta) {
            let cart = app.cart;
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            app.cart = cart;
            updateCartBadges();
            if (app.cart.length === 0) closeCartModal();
            else renderCartItems();
        }

        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
        
        function removeFromCart(index) { 
            let cart = app.cart;
            cart.splice(index, 1); 
            app.cart = cart;
            updateCartBadges(); 
            if (app.cart.length === 0) closeCartModal(); 
            else renderCartItems(); 
        }

        function submitOrder() {
            const cart = app.cart;
            if (cart.length === 0) { alert("Cart is empty!"); return; }
            const ticketId = Date.now().toString().slice(-3);
            let nameInput = document.getElementById('customerName').value.trim();
            let finalCustomerName = (!nameInput || nameInput.toLowerCase() === 'guest') ? `Guest #${ticketId}` : `${nameInput} (#${ticketId})`;

            const notes = document.getElementById('customerOrderNotes').value.trim();
            const summary = cart.map(i => `${i.quantity}x ${i.name}`).join(', ');
            const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            
            const extraAddMins = parseInt(app.extraWait) || 0;
            const newOrder = {
                id: ticketId,
                name: finalCustomerName,
                items: summary,
                status: "Preparing",
                total,
                timestamp: Date.now(),
                notes,
                cartSnapshot: [...cart],
                extraWaitMins: extraAddMins
            };

            let orders = app.orders;
            orders.unshift(newOrder);
            app.orders = orders;
            app.cart = []; 
            closeCartModal(); 
            updateCartBadges(); 

            document.getElementById('successTicketNum').innerText = `#${newOrder.id}`;
            document.getElementById('successCustomerName').innerText = `Customer: ${newOrder.name}`;
            document.getElementById('successModal').style.display = 'flex';
        }

        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
            switchView('tracker');
        }

        function renderTracker() {
            const container = document.getElementById('activeOrdersList');
            if(!container) return;
            const orders = app.orders;
            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-8 text-xs">No active orders right now.</div>`;
                return;
            }
            container.innerHTML = orders.map(o => {
                const waitMins = Math.floor((Date.now() - o.timestamp) / 60000);
                const extraAdded = o.extraWaitMins || 0;
                return `
                    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <span class="text-xs text-pink-500 font-mono font-bold">Ticket #${o.id} • ${o.name}</span>
                            <div class="text-[11px] text-zinc-400 mt-0.5">Elapsed time: ~${waitMins}m ${extraAdded ? `(+${extraAdded}m kitchen delay)` : ''}</div>
                            <span class="inline-block mt-2 px-2.5 py-1 rounded-full text-xs font-medium ${o.status === 'Preparing' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">${o.status}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
